name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(php -r '
              $source = file_get_contents("tagdiv-liveblog.php");
              if (!preg_match("/^ \* Version:\\s*([^\\s]+)$/m", $source, $matches)) {
                  fwrite(STDERR, "Unable to read plugin version\n");
                  exit(1);
              }
              echo $matches[1];
          ')"
          if [[ -z "$version" ]]; then
            echo "Plugin version is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=yes" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do."
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable plugin ZIP
        if: steps.existing_release.outputs.exists != 'yes'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/tagdiv-liveblog
          rsync -a ./ dist/tagdiv-liveblog/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist'
          (
            cd dist
            zip -qr "tagdiv-liveblog-${VERSION}.zip" tagdiv-liveblog
            sha256sum "tagdiv-liveblog-${VERSION}.zip" > "tagdiv-liveblog-${VERSION}.zip.sha256"
          )

      - name: Write release notes
        if: steps.existing_release.outputs.exists != 'yes'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '## tagDiv Liveblog %s\n\n' "$VERSION" > dist/release-notes.md
          cat >> dist/release-notes.md <<'EOF'
          This maintenance release updates the WordPress plugin author metadata without changing runtime behavior.

          Changes:
          - the plugin author is now shown as `OmniaTV`;
          - the author name links to `https://omniatv.com` through the standard WordPress `Author URI` header;
          - `Plugin URI` and `Update URI` continue to point to the GitHub repository;
          - no rendering, Liveblog, Composer, updater, CSS or JavaScript behavior changes are included.

          Validation:
          - wp-admin → Plugins displays `OmniaTV` as the author;
          - the author link opens `https://omniatv.com`;
          - the plugin remains active and existing Liveblog behavior is unchanged.
          EOF

      - name: Create GitHub release
        if: steps.existing_release.outputs.exists != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/tagdiv-liveblog-${VERSION}.zip" \
            "dist/tagdiv-liveblog-${VERSION}.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "tagDiv Liveblog ${VERSION}" \
            --notes-file dist/release-notes.md
