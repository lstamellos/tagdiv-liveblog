name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(php -r '
              $source = file_get_contents("tagdiv-liveblog.php");
              if (!preg_match("/^ \* Version:\\s*([^\\s]+)$/m", $source, $matches)) {
                  fwrite(STDERR, "Unable to read plugin version\n");
                  exit(1);
              }
              echo $matches[1];
          ')"
          if [[ -z "$version" ]]; then
            echo "Plugin version is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=yes" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do."
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable plugin ZIP
        if: steps.existing_release.outputs.exists != 'yes'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/tagdiv-liveblog
          rsync -a ./ dist/tagdiv-liveblog/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist'
          (
            cd dist
            zip -qr "tagdiv-liveblog-${VERSION}.zip" tagdiv-liveblog
            sha256sum "tagdiv-liveblog-${VERSION}.zip" > "tagdiv-liveblog-${VERSION}.zip.sha256"
          )

      - name: Write release notes
        if: steps.existing_release.outputs.exists != 'yes'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cat > dist/release-notes.md <<EOF
          ## tagDiv Liveblog ${VERSION}

          This maintenance release fixes metadata-prefix alignment in the TagDiv Liveblog presentation layer without changing Automattic Liveblog markup or runtime behavior.

          Fixes:
          - Timestamp prefix now appears horizontally beside the time metadata instead of above it.
          - In `Both` time mode, the prefix sits beside the existing relative/exact time stack while that stack remains vertically arranged.
          - Author prefix now appears in the first author row beside the avatar/name instead of above the author metadata.
          - Stacked and inline metadata layouts, metadata order, separators and left/center/right alignment remain unchanged.

          Regression validation:
          - exact time with timestamp prefix;
          - `Both` time mode with timestamp prefix;
          - author prefix with avatar/name;
          - inline metadata with separator;
          - stacked metadata;
          - pagination, archived notice, Archive/Reopen controls and numeric entry deep links remain unaffected.

          Validated on OmniaTV with WordPress 7.0.3, PHP 8.3.6, Newspaper 12.7.7, tagDiv Composer 5.4.6 and Automattic Liveblog 1.12.2.
          EOF

      - name: Create GitHub release
        if: steps.existing_release.outputs.exists != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/tagdiv-liveblog-${VERSION}.zip" \
            "dist/tagdiv-liveblog-${VERSION}.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "tagDiv Liveblog ${VERSION}" \
            --notes-file dist/release-notes.md
