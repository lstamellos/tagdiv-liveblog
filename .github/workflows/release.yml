name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(php -r '
              $source = file_get_contents("tagdiv-liveblog.php");
              if (!preg_match("/^ \* Version:\\s*([^\\s]+)$/m", $source, $matches)) {
                  fwrite(STDERR, "Unable to read plugin version\n");
                  exit(1);
              }
              echo $matches[1];
          ')"
          if [[ -z "$version" ]]; then
            echo "Plugin version is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=yes" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do."
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable plugin ZIP
        if: steps.existing_release.outputs.exists != 'yes'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/tagdiv-liveblog
          rsync -a ./ dist/tagdiv-liveblog/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist'
          (
            cd dist
            zip -qr "tagdiv-liveblog-${VERSION}.zip" tagdiv-liveblog
            sha256sum "tagdiv-liveblog-${VERSION}.zip" > "tagdiv-liveblog-${VERSION}.zip.sha256"
          )

      - name: Write release notes
        if: steps.existing_release.outputs.exists != 'yes'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cat > dist/release-notes.md <<EOF
          ## tagDiv Liveblog ${VERSION}

          This release adds native GitHub Releases updates and an archived-Liveblog completion notice while preserving Automattic Liveblog as the runtime renderer and paginator.

          Highlights:
          - this GitHub repository is declared as the WordPress Update URI for tagDiv Liveblog;
          - stable GitHub Releases provide WordPress update metadata and the exact named installable ZIP asset;
          - release ZIPs are verified against the SHA-256 digest published by GitHub before installation;
          - automatic updates are never forced by the plugin and remain controlled by the user's normal per-plugin WordPress auto-update setting;
          - archived Liveblogs display the message “Η ανταπόκριση έχει ολοκληρωθεί” above the Liveblog feed on every native pagination page;
          - the archived notice remains outside the React feed, so First / Prev / Next / Last continue to be fully native Automattic Liveblog behavior;
          - the TagDiv block exposes archived-notice typography, colors, border, radius, padding, spacing, alignment and text-transform controls;
          - active Liveblogs render no archived-notice markup on the frontend;
          - the configurable page-size and numeric entry deep-link behavior introduced in 0.1.15 remains unchanged.

          Validation:
          - active and archived Liveblogs;
          - archived notice persistence across native pagination pages;
          - archived notice Composer preview and frontend styling;
          - direct numeric entry deep links with archived notice present;
          - GitHub stable-release discovery and exact release-asset selection;
          - SHA-256 package verification;
          - native WordPress per-plugin automatic-update preference remains authoritative;
          - Global Single Template integration.

          Validated on OmniaTV with WordPress 7.0.3, PHP 8.3.6, Newspaper 12.7.7, tagDiv Composer 5.4.6 and Automattic Liveblog 1.12.2.
          EOF

      - name: Create GitHub release
        if: steps.existing_release.outputs.exists != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/tagdiv-liveblog-${VERSION}.zip" \
            "dist/tagdiv-liveblog-${VERSION}.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "tagDiv Liveblog ${VERSION}" \
            --notes-file dist/release-notes.md
